<!DOCTYPE html>
<html>

<head>

    <title>AI Object Detection System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>AI Object Detection System</h1>

    <p>Real-Time Object Detection & Inspection</p>

</header>


<div class="container">

    <!-- Webcam Detection -->

    <h2>Live Camera Detection</h2>

    <button onclick="startDetection()">
        Start Detection
    </button>

    <button onclick="stopDetection()">
        Stop Detection
    </button>


    <!-- Dashboard -->

    <div class="dashboard">

        <div class="card">

            <h3>Total Objects</h3>

            <p id="total">0</p>

        </div>


        <div class="card">

            <h3>People</h3>

            <p id="person">0</p>

        </div>


        <div class="card">

            <h3>Cars</h3>

            <p id="car">0</p>

        </div>


        <div class="card">

            <h3>Bottles</h3>

            <p id="bottle">0</p>

        </div>

    </div>


    <!-- Camera -->

    <img id="video"
         width="800"
         style="max-width:100%; display:none;">


    <hr>


    <!-- Upload Image -->

    <h2>Upload Image</h2>

    <form action="/upload"
          method="POST"
          enctype="multipart/form-data">

        <input
            type="file"
            name="file"
            accept="image/*"
            required>

        <br><br>

        <button type="submit">
            Detect Objects
        </button>

    </form>


    <!-- Detection Message -->

    {% if message %}

        <h3>{{ message }}</h3>

    {% endif %}


    <!-- Detection Result -->

    {% if result_image %}

        <h2>Detection Result</h2>

        <img
            src="{{ result_image }}"
            width="800"
            style="max-width:100%;">

    {% endif %}

</div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
